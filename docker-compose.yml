services:
  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP_FILTER: "@photo-weather/web"
    env_file:
      - .env
    command: corepack pnpm --filter @photo-weather/web dev
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP_FILTER: "@photo-weather/api"
    env_file:
      - .env
    command: corepack pnpm --filter @photo-weather/api dev
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        APP_FILTER: "@photo-weather/worker"
    env_file:
      - .env
    command: corepack pnpm --filter @photo-weather/worker dev
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photo_weather_ai
      POSTGRES_USER: photo_weather
      POSTGRES_PASSWORD: photo_weather
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
