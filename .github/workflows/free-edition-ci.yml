name: Free edition CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: free-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/service
          PUBLIC_SITE_URL: https://weather.example.test
          API_BASE_URL: http://127.0.0.1:4000
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node --test scripts/free-local-db.test.mjs
      - run: python3 scripts/test-production-env.py
      - run: pnpm audit --prod

  production-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and exercise the free production stack
        run: bash scripts/ci-free-production.sh
